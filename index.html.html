<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Toy Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        
        .search-box {
            flex: 1;
            margin-right: 20px;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1em;
        }
        
        .category-filter {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        .filter-btn {
            padding: 8px 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .filter-btn.active {
            background: #667eea;
            color: white;
        }
        
        .filter-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .cart-icon {
            position: relative;
            font-size: 24px;
            cursor: pointer;
        }
        
        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff6b6b;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }
        
        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }
        
        .product-info {
            padding: 15px;
        }
        
        .product-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .product-category {
            font-size: 0.85em;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .product-price {
            font-size: 1.5em;
            color: #ff6b6b;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .product-rating {
            color: #ffc107;
            margin-bottom: 10px;
        }
        
        .add-to-cart-btn {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        
        .add-to-cart-btn:hover {
            background: #764ba2;
        }
        
        .cart-sidebar {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        
        .cart-sidebar h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .cart-items {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 0.9em;
        }
        
        .cart-item-name {
            flex: 1;
            color: #333;
        }
        
        .cart-item-price {
            color: #ff6b6b;
            font-weight: bold;
            margin-right: 10px;
        }
        
        .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
        }
        
        .cart-summary {
            border-top: 2px solid #eee;
            padding-top: 15px;
        }
        
        .summary-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .total {
            color: #667eea;
            font-size: 1.3em;
        }
        
        .checkout-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: background 0.3s ease;
        }
        
        .checkout-btn:hover:not(:disabled) {
            background: #764ba2;
        }
        
        .checkout-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .empty-cart {
            text-align: center;
            color: #999;
            padding: 20px;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        
        .modal-content h2 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .close-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Online Toy Store 🧩</h1>
            <div class="header-info">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search toys by name...">
                </div>
                <div class="cart-icon" onclick="toggleCart()">
                    🛒
                    <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
            <div class="category-filter">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="action">Action Figures</button>
                <button class="filter-btn" data-category="building">Building Blocks</button>
                <button class="filter-btn" data-category="doll">Dolls</button>
                <button class="filter-btn" data-category="vehicle">Vehicles</button>
            </div>
        </header>
        
        <div class="main-content">
            <div class="products-grid" id="productsGrid"></div>
            
            <div class="cart-sidebar">
                <h2>Shopping Cart</h2>
                <div class="cart-items" id="cartItems">
                    <div class="empty-cart">Your cart is empty</div>
                </div>
                <div class="cart-summary">
                    <div class="summary-line">
                        <span>Subtotal:</span>
                        <span id="subtotal">₹0</span>
                    </div>
                    <div class="summary-line">
                        <span>Tax (9%):</span>
                        <span id="tax">₹0</span>
                    </div>
                    <div class="summary-line total">
                        <span>Total:</span>
                        <span id="total">₹0</span>
                    </div>
                    <button class="checkout-btn" id="checkoutBtn" onclick="checkout()" disabled>Checkout</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification"></div>
    
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <h2>✅ Order Confirmed!</h2>
            <p id="orderDetails"></p>
            <button class="close-btn" onclick="closeModal()">Continue Shopping</button>
        </div>
    </div>

    <script>
        // Sample toy data
        const toys = [
            { id: 1, name: 'Superman Action Figure', category: 'action', price: 299, emoji: '🦸' },
            { id: 2, name: 'LEGO Castle Set', category: 'building', price: 1299, emoji: '🏰' },
            { id: 3, name: 'Barbie Doll', category: 'doll', price: 699, emoji: '👧' },
            { id: 4, name: 'Remote Control Car', category: 'vehicle', price: 799, emoji: '🏎️' },
            { id: 5, name: 'Spider-Man Figure', category: 'action', price: 399, emoji: '🕷️' },
            { id: 6, name: 'Wooden Blocks Set', category: 'building', price: 599, emoji: '🟦' },
            { id: 7, name: 'Princess Doll', category: 'doll', price: 799, emoji: '👑' },
            { id: 8, name: 'Toy Helicopter', category: 'vehicle', price: 649, emoji: '🚁' },
            { id: 9, name: 'Batman Figure', category: 'action', price: 349, emoji: '🦇' },
            { id: 10, name: 'LEGO City Set', category: 'building', price: 1499, emoji: '🏢' },
            { id: 11, name: 'Baby Doll with Accessories', category: 'doll', price: 549, emoji: '👶' },
            { id: 12, name: 'Toy Train Set', category: 'vehicle', price: 899, emoji: '🚂' }
        ];

        let cart = [];
        let filteredToys = toys;
        let selectedCategory = 'all';

        // Initialize the store
        document.addEventListener('DOMContentLoaded', function() {
            renderProducts();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Search functionality
            document.getElementById('searchInput').addEventListener('keyup', function(e) {
                filterProducts();
            });

            // Category filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedCategory = this.getAttribute('data-category');
                    filterProducts();
                });
            });
        }

        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            filteredToys = toys.filter(toy => {
                const matchesSearch = toy.name.toLowerCase().includes(searchTerm);
                const matchesCategory = selectedCategory === 'all' || toy.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });

            renderProducts();
        }

        function renderProducts() {
            const productsGrid = document.getElementById('productsGrid');
            productsGrid.innerHTML = '';

            if (filteredToys.length === 0) {
                productsGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: white; font-size: 1.2em;">No toys found. Try a different search!</p>';
                return;
            }

            filteredToys.forEach(toy => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <div class="product-image">${toy.emoji}</div>
                    <div class="product-info">
                        <div class="product-name">${toy.name}</div>
                        <div class="product-category">${toy.category.toUpperCase()}</div>
                        <div class="product-price">₹${toy.price}</div>
                        <div class="product-rating">⭐⭐⭐⭐⭐</div>
                        <button class="add-to-cart-btn" onclick="addToCart(${toy.id})">Add to Cart</button>
                    </div>
                `;
                productsGrid.appendChild(productCard);
            });
        }

        function addToCart(toyId) {
            const toy = toys.find(t => t.id === toyId);
            
            // Check if item already in cart
            const existingItem = cart.find(item => item.id === toyId);
            
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({
                    id: toy.id,
                    name: toy.name,
                    price: toy.price,
                    quantity: 1
                });
            }

            updateCart();
            showNotification(`${toy.name} added to cart!`);
        }

        function removeFromCart(toyId) {
            cart = cart.filter(item => item.id !== toyId);
            updateCart();
            showNotification('Item removed from cart');
        }

        function updateCart() {
            const cartItemsDiv = document.getElementById('cartItems');
            const cartCountSpan = document.getElementById('cartCount');

            // Update cart count
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCountSpan.textContent = totalItems;

            // Update cart items display
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
                document.getElementById('checkoutBtn').disabled = true;
            } else {
                cartItemsDiv.innerHTML = '';
                cart.forEach(item => {
                    const cartItem = document.createElement('div');
                    cartItem.className = 'cart-item';
                    cartItem.innerHTML = `
                        <span class="cart-item-name">${item.name} (x${item.quantity})</span>
                        <span class="cart-item-price">₹${item.price * item.quantity}</span>
                        <button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button>
                    `;
                    cartItemsDiv.appendChild(cartItem);
                });
                document.getElementById('checkoutBtn').disabled = false;
            }

            updateTotals();
        }

        function updateTotals() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = Math.round(subtotal * 0.09);
            const total = subtotal + tax;

            document.getElementById('subtotal').textContent = '₹' + subtotal;
            document.getElementById('tax').textContent = '₹' + tax;
            document.getElementById('total').textContent = '₹' + total;
        }

        function checkout() {
            if (cart.length === 0) {
                showNotification('Cart is empty!');
                return;
            }

            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const total = document.getElementById('total').textContent;

            document.getElementById('orderDetails').innerHTML = `
                <p>Thank you for your order!</p>
                <p><strong>${totalItems} items</strong> ordered</p>
                <p>Total Amount: <strong>${total}</strong></p>
                <p>Your order will be delivered in 2-3 business days.</p>
            `;

            document.getElementById('checkoutModal').classList.add('active');
            cart = [];
            updateCart();
        }

        function closeModal() {
            document.getElementById('checkoutModal').classList.remove('active');
            showNotification('Thank you for shopping with us!');
        }

        function toggleCart() {
            const sidebar = document.querySelector('.cart-sidebar');
            sidebar.style.display = sidebar.style.display === 'none' ? 'block' : 'none';
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
